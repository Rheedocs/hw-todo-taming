<!doctype html>
<html lang="da" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To Do Taming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <main class="container py-5">
      <header class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Mine opgaver</h1>
        <button id="theme-toggle" class="btn btn-outline-secondary" type="button">Mørkt tema</button>
      </header>
      <form id="task-form" class="mb-3">
        <label for="task-input">Ny opgave</label>
        <div class="input-group">
          <input id="task-input" class="form-control" name="text" type="text" autocomplete="off">
          <button class="btn btn-primary" type="submit">Tilføj</button>
        </div>
      </form>
      <p id="error-message" class="alert alert-danger" role="alert" hidden></p>
      <ul id="task-list" class="list-group"></ul>
    </main>
    <script src="main.js"></script>
  </body>
</html>
